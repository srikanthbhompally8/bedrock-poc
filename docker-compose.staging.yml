# Docker Compose for Staging Environment
# Similar to production but with debug enabled for troubleshooting
# Start with: docker-compose -f docker-compose.staging.yml up

version: '3.8'

services:
  # PostgreSQL Database (AWS RDS in production, local for staging)
  postgres:
    image: postgres:14-alpine
    container_name: bedrock-postgres-staging
    environment:
      POSTGRES_USER: postgres_staging
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: bedrock_staging
    ports:
      - "5432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedrock-staging

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bedrock-redis-staging
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-me}
    ports:
      - "6379:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedrock-staging

  # Bedrock POC Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bedrock-api-staging
    restart: always
    environment:
      ENVIRONMENT: staging
      DEBUG: "true"
      RELOAD: "false"
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres_staging
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_NAME: bedrock_staging
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
      DB_SSL_MODE: prefer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
      REDIS_ENABLED: "true"
      BEDROCK_MODEL_ID: us.anthropic.claude-3-5-sonnet-20241022-v2:0
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AUTH_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-secure-key}
      AUTH_RATE_LIMIT_REQUESTS: 100
      AUTH_ENABLE_CORS: "true"
      AUTH_CORS_ORIGINS: https://staging.yourdomain.com,http://localhost:3000
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOG_ENABLE_REQUEST_LOGGING: "true"
      MONITOR_ENABLE_METRICS: "true"
      MONITOR_ENABLE_HEALTH_CHECKS: "true"
      ENABLE_AUDIT_LOGGING: "true"
      ENABLE_RATE_LIMITING: "true"
    ports:
      - "8000:8000"    # API
      - "9090:9090"    # Metrics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bedrock-staging
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bedrock-nginx-staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
    networks:
      - bedrock-staging

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bedrock-prometheus-staging
    restart: always
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - bedrock-staging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: bedrock-grafana-staging
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - bedrock-staging
    profiles:
      - monitoring

volumes:
  postgres_staging_data:
  redis_staging_data:
  prometheus_data:
  grafana_data:
  nginx_logs:

networks:
  bedrock-staging:
    driver: bridge
