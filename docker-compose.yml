# Docker Compose for Local Development
# Start with: docker-compose up

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: bedrock-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bedrock_poc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedrock-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: bedrock-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedrock-network
    profiles:
      - cache

  # Bedrock POC Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bedrock-api-dev
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      RELOAD: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bedrock_poc
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: "false"
      BEDROCK_MODEL_ID: us.anthropic.claude-3-5-sonnet-20241022-v2:0
      AWS_REGION: us-east-1
      AUTH_JWT_SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: DEBUG
      LOG_FORMAT: text
      MONITOR_ENABLE_METRICS: "true"
      INITIALIZE_DB: "true"
    ports:
      - "8000:8000"    # API
      - "9090:9090"    # Metrics
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - bedrock-network
    command: >
      sh -c "python -m uvicorn bedrock_poc.api.main:app
             --host 0.0.0.0 --port 8000 --reload"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: bedrock-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - bedrock-network
    profiles:
      - nginx

volumes:
  postgres_data:
  redis_data:

networks:
  bedrock-network:
    driver: bridge
