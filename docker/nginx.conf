# Nginx reverse proxy configuration for Bedrock POC
# Use this behind the Docker container or in production

upstream bedrock_api {
    # Connect to the application container on port 8000
    server bedrock-api:8000;
    keepalive 32;
}

upstream prometheus {
    # Prometheus metrics server on port 9090
    server bedrock-api:9090;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=10r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }

    # Allow well-known for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS server (production)
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # SSL certificate configuration (replace with your paths)
    # ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/bedrock-access.log;
    error_log /var/log/nginx/bedrock-error.log;

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://bedrock_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection settings
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check endpoints (stricter rate limit)
    location /api/health {
        limit_req zone=strict_limit burst=5 nodelay;

        proxy_pass http://bedrock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Metrics endpoint (internal only, no rate limit)
    location /metrics {
        # Restrict to internal network or add authentication
        # allow 10.0.0.0/8;
        # deny all;

        proxy_pass http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # WebSocket support (if needed in future)
    location /ws/ {
        proxy_pass http://bedrock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static files (if any)
    location /static/ {
        alias /var/www/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTP server (development/local)
server {
    listen 80;
    server_name localhost 127.0.0.1;

    access_log /var/log/nginx/bedrock-access.log;
    error_log /var/log/nginx/bedrock-error.log;

    # API endpoints (no rate limiting in dev)
    location /api/ {
        proxy_pass http://bedrock_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /api/health {
        proxy_pass http://bedrock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Metrics endpoint
    location /metrics {
        proxy_pass http://prometheus;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
