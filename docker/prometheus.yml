# Prometheus Configuration for Bedrock POC
# Scrapes metrics from the API and optional exporters

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bedrock-poc'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules for alerting (optional)
# rule_files:
#   - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Bedrock POC API metrics
  - job_name: 'bedrock-api'
    static_configs:
      - targets: ['bedrock-api:9090']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'bedrock-api-prod'

  # PostgreSQL exporter (if available)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: 'postgres-prod'

  # Redis exporter (if available)
